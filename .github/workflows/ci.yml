name: KubeForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements.txt
      - name: Install dependencies
        working-directory: application
        run: python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: application
        run: python -m pytest tests/ -v

  helm-lint:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/kubeforge
      - name: Render chart
        run: helm template kubeforge helm/kubeforge

  secret-scan:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config p/python application/

  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false
      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate

  dependency-scan:
    name: Scan Python Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: application/
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  publish-image:
    name: Build, Scan and Publish Container
    runs-on: ubuntu-latest
    needs: [test, helm-lint, secret-scan, sast, terraform-check, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: kubeforge-api:ci

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: kubeforge-api:ci
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push verified image
        shell: bash
        run: |
          docker tag kubeforge-api:ci ghcr.io/kesab2909/kubeforge-api:latest
          docker tag kubeforge-api:ci ghcr.io/kesab2909/kubeforge-api:${{ github.sha }}
          docker push ghcr.io/kesab2909/kubeforge-api:latest
          docker push ghcr.io/kesab2909/kubeforge-api:${{ github.sha }}
