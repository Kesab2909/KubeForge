
name: KubeForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements.txt

      - name: Install dependencies
        working-directory: application
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: application
        run: python -m pytest tests/ -v

  helm-lint:
    name: Validate Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/kubeforge

      - name: Render chart
        run: helm template kubeforge helm/kubeforge
