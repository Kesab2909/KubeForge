apiVersion: v1
kind: Namespace
metadata:
  name: kubeforge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeforge-config
  namespace: kubeforge
data:
  APP_NAME: "kubeforge-api"
  APP_VERSION: "1.0.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: kubeforge-secret
  namespace: kubeforge
type: Opaque
stringData:
  DEMO_SECRET: "replace-this-demo-value"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeforge-api
  namespace: kubeforge
  labels:
    app: kubeforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeforge-api
  template:
    metadata:
      labels:
        app: kubeforge-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: kubeforge-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kubeforge-config
            - secretRef:
                name: kubeforge-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kubeforge-api
  namespace: kubeforge
spec:
  type: NodePort
  selector:
    app: kubeforge-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kubeforge-api
  namespace: kubeforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kubeforge-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
