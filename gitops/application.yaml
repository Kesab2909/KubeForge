apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeforge-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kesab2909/KubeForge.git
    targetRevision: main
    path: helm/kubeforge
    helm:
      values: |
        replicaCount: 2
        image:
          repository: ghcr.io/kesab2909/kubeforge-api
          tag: latest
          pullPolicy: Always
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 70
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeforge-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
